# ─────────────────────────────────────────────────────────────────────────────
# LOCAL DEVELOPMENT
#   Run `npm run dev:all` to start Astro + decap-server simultaneously.
#   The local_backend proxy intercepts all CMS requests during local dev.
#
# PRODUCTION (GitHub Pages)
#   The GitHub backend requires an OAuth proxy. Two options:
#   A) Sveltia CMS (recommended) — drop-in replacement, deploy a free Cloudflare
#      Worker as the OAuth proxy (~5 min setup):
#      https://github.com/sveltia/sveltia-cms#sign-in-with-github
#   B) Self-host netlify-cms-github-oauth-provider on Render/Railway:
#      https://github.com/vencax/netlify-cms-github-oauth-provider
# ─────────────────────────────────────────────────────────────────────────────

local_backend: true

backend:
  name: github
  repo: fjord-works-software/pathtaker
  branch: main
  base_url: https://sveltia-cms-auth.fjordworkssoftware.workers.dev/

media_folder: public/images
public_folder: /images

collections:
  - name: home
    label: Home Page
    files:
      - name: home
        label: Home Page
        file: src/content/pages/home.md
        fields:
          - { name: intro_heading, label: Welcome Heading, widget: string }
          - { name: intro_body, label: Welcome Body, widget: text }
          - { name: image_text_heading, label: Image Section Heading, widget: string }
          - { name: body, label: Image Section Body, widget: markdown }

  - name: services
    label: Services Page
    files:
      - name: services
        label: Services Page
        file: src/content/pages/services.md
        fields:
          - { name: page_heading, label: Page Heading, widget: string }
          - { name: tagline, label: Tagline, widget: string }
          - { name: quote, label: Quote, widget: text }
          - { name: approach_heading, label: Approach Section Heading, widget: string }
          - { name: approach_intro, label: Approach Intro, widget: string }
          - name: modalities
            label: Therapy Modalities
            widget: list
            field: { name: modality, label: Modality, widget: string }
          - name: services
            label: Services
            widget: list
            fields:
              - { name: icon, label: Icon (emoji), widget: string, required: false }
              - { name: name, label: Service Name, widget: string }
              - { name: description, label: Description, widget: text }
          - { name: cta, label: Call to Action Text, widget: string }

  - name: contact
    label: Contact Page
    files:
      - name: contact
        label: Contact Page
        file: src/content/pages/contact.md
        fields:
          - { name: access_key, label: Web3Forms Access Key, widget: string }
          - { name: subject, label: Email Subject, widget: string }
          - { name: name_label, label: Name Field Label, widget: string }
          - { name: name_placeholder, label: Name Field Placeholder, widget: string }
          - { name: email_label, label: Email Field Label, widget: string }
          - { name: email_placeholder, label: Email Field Placeholder, widget: string }
          - { name: phone_label, label: Phone Field Label, widget: string }
          - { name: phone_placeholder, label: Phone Field Placeholder, widget: string }
          - { name: message_label, label: Message Field Label, widget: string }
          - { name: message_placeholder, label: Message Field Placeholder, widget: string }
          - { name: submit_label, label: Submit Button Label, widget: string }

  - name: donate
    label: Donate Page
    files:
      - name: donate
        label: Donate Page
        file: src/content/pages/donate.md
        fields:
          - { name: donate_heading, label: Heading, widget: string }
          - { name: donate_intro, label: Intro Paragraph, widget: text }
          - { name: donate_disclaimer, label: Disclaimer, widget: string }
          - name: zeffy_form_url
            label: Zeffy Form URL
            widget: string
            hint: >-
              Paste the share link from Zeffy (e.g.
              https://www.zeffy.com/en-US/donation-form/your-form). The embed
              version is generated automatically.
          - name: zeffy_display
            label: How to Show the Donation Form
            widget: select
            default: button
            options:
              - { label: "Button linking to Zeffy", value: button }
              - { label: "Embedded form on this page", value: embed }
          - { name: donate_button_label, label: Button Label, widget: string, required: false }

  - name: board
    label: Board Page
    files:
      - name: board
        label: Board Page
        file: src/content/pages/board.md
        fields:
          - { name: page_heading, label: Page Heading, widget: string }
          - { name: page_intro, label: Intro Text, widget: string }

  - name: team
    label: Board Members
    folder: src/content/team
    create: true
    extension: md
    format: frontmatter
    fields:
      - { name: name, label: Name, widget: string }
      - { name: title, label: Title, widget: string }
      - { name: photo, label: Photo, widget: image }
      - { name: order, label: Nav Order, widget: number, default: 99 }
      - { name: image_left, label: Image on Left, widget: boolean, default: true }
      - { name: body, label: Bio, widget: markdown }
